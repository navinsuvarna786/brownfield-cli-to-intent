catalyst_center:
  inventory:
    devices:
    - name: DATACTR-NXOS-SW02
      fqdn_name: DATACTR-NXOS-SW02.campus.example.edu
      device_ip: need_input
      pid: C9300-24P
      serial_number: TBD-MIGRATION
      state: PNP
      device_role: ACCESS
      site: need_input
      onboarding_template:
        name: EDGE_PNP_template
        variables:
        - name: device_host_name
          value: DATACTR-NXOS-SW02
        - name: domain_name
          value: campus.example.edu
        - name: pnp_vlan_id
          value: '1'
        - name: pnp_vlan_name
          value: MGMT
        - name: pnp_vlan_network_add
          value: need_input
        - name: pnp_vlan_network_mask
          value: 255.255.255.0
        - name: pnp_vlan_default_gateway
          value: need_input
        - name: pnp_interface
          value: GigabitEthernet1/0/1
        - name: snmp_community_ro
          value: need_input
        - name: log_server
          value: need_input
        - name: is_stack
          value: 'false'
        - name: stack_members
          value: '1'
      dayn_templates:
        regular:
        - name: EDGE_SYSTEM_template
          variables:
          - name: enable_secret
            value: need_input
          - name: hostname
            value: DATACTR-NXOS-SW02
          - name: domain_name
            value: campus.example.edu
          - name: timezone
            value: need_input
          - name: timezone_offset
            value: need_input
          - name: daylight_savings_name
            value: need_input
          - name: dns_servers
            value: 192.0.2.50
          - name: ntp_servers
            value: 192.0.2.11
          - name: license_level
            value: network-advantage
          - name: stp_mode
            value: need_input
          - name: ntp_authenticate
            value: 'false'
          - name: ntp_master
            value: 'false'
          - name: logging_servers
            value: |
              need_input
          - name: log_severity_level
            value: informational
          - name: errdisable_causes
            value: |
              need_input
          - name: local_users
            value: |
              admin:need_input
          redeploy_template: ON_CHANGE
        - name: EDGE_VLAN_template
          variables:
          - name: vlans
            value: 1|VLAN_0001,900|SERVER-900,901|SERVER-901,902|SERVER-902
          - name: vtp_domain
            value: CWAN
          - name: vtp_mode
            value: transparent
          redeploy_template: ON_CHANGE
        - name: EDGE_MGMT_template
          variables:
          - name: enable_management
            value: 'false'
          - name: http_server
            value: 'true'
          - name: https_server
            value: 'true'
          - name: mgmt_interface_type
            value: vlan
          - name: mgmt_vlan_id
            value: '1'
          - name: mgmt_ip_address
            value: need_input
          - name: mgmt_subnet_mask
            value: 255.255.255.0
          - name: mgmt_default_gateway
            value: need_input
          - name: mgmt_vlan_name
            value: MGMT
          redeploy_template: ON_CHANGE
        - name: EDGE_SNMP_template
          variables:
          - name: snmp_community_ro
            value: need_input
          - name: snmp_community_rw
            value: need_input
          - name: snmp_location
            value: need_input
          - name: snmp_contact
            value: need_input
          - name: enable_traps
            value: 'false'
          redeploy_template: ON_CHANGE
