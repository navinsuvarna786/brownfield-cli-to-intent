catalyst_center:
  inventory:
    devices:
    - name: STRESS-AUTOCORRECT-SW01
      fqdn_name: STRESS-AUTOCORRECT-SW01.campus.example.edu
      device_ip: need_input
      pid: C9300-24P
      serial_number: TBD-MIGRATION
      state: PNP
      device_role: ACCESS
      site: need_input
      onboarding_template:
        name: EDGE_PNP_template
        variables:
        - name: device_host_name
          value: STRESS-AUTOCORRECT-SW01
        - name: domain_name
          value: campus.example.edu
        - name: pnp_vlan_id
          value: '1'
        - name: pnp_vlan_name
          value: MGMT
        - name: pnp_vlan_network_add
          value: need_input
        - name: pnp_vlan_network_mask
          value: 255.255.255.0
        - name: pnp_vlan_default_gateway
          value: 192.0.2.254
        - name: pnp_interface
          value: GigabitEthernet1/0/1
        - name: snmp_community_ro
          value: xxxxxxxx
        - name: log_server
          value: 192.0.2.21
        - name: is_stack
          value: 'false'
        - name: stack_members
          value: '1'
      dayn_templates:
        regular:
        - name: EDGE_SYSTEM_template
          variables:
          - name: enable_secret
            value: need_input
          - name: hostname
            value: STRESS-AUTOCORRECT-SW01
          - name: domain_name
            value: campus.example.edu
          - name: timezone
            value: CST
          - name: timezone_offset
            value: need_input
          - name: daylight_savings_name
            value: need_input
          - name: dns_servers
            value: need_input
          - name: ntp_servers
            value: need_input
          - name: license_level
            value: network-advantage
          - name: stp_mode
            value: need_input
          - name: ntp_authenticate
            value: 'false'
          - name: ntp_master
            value: 'false'
          - name: logging_servers
            value: |
              192.0.2.21,192.0.2.22
          - name: log_severity_level
            value: informational
          - name: errdisable_causes
            value: |
              need_input
          redeploy_template: ON_CHANGE
        - name: EDGE_VLAN_template
          variables:
          - name: vlans
            value: 10|DATA,20|VOICE,900|MGMT
          - name: vtp_domain
            value: CWAN
          - name: vtp_mode
            value: transparent
          redeploy_template: ON_CHANGE
        - name: EDGE_MGMT_template
          variables:
          - name: enable_management
            value: 'false'
          - name: http_server
            value: 'true'
          - name: https_server
            value: 'true'
          - name: mgmt_interface_type
            value: vlan
          - name: mgmt_vlan_id
            value: '1'
          - name: mgmt_ip_address
            value: need_input
          - name: mgmt_subnet_mask
            value: 255.255.255.0
          - name: mgmt_default_gateway
            value: 192.0.2.254
          - name: mgmt_vlan_name
            value: MGMT
          redeploy_template: ON_CHANGE
        - name: EDGE_ACL_template
          variables:
          - name: standard_acls
            value: |
              13|10|permit|host 192.0.2.11||false,
              13|20|permit|host 192.0.2.12||false,
              13|30|permit|host 192.0.2.0||false
          - name: extended_acls
            value: ''
          redeploy_template: ON_CHANGE
        - name: EDGE_UPLINK_template
          variables:
          - name: uplinks
            value: |
              port-channel||UPLINK-PC10|10|10,20,900|900|true||TenGigabitEthernet1/1/1:active:PORT-CHANNEL MEMBER
          redeploy_template: ON_CHANGE
        - name: EDGE_SNMP_template
          variables:
          - name: snmp_community_ro
            value: xxxxxxxx
          - name: snmp_community_rw
            value: need_input
          - name: snmp_location
            value: Building-Stress Floor-4 IDF
          - name: snmp_contact
            value: NOC
          - name: chassis_id
            value: STRESS-AUTOCORRECT-SW01
          - name: snmp_acl_ro
            value: '13'
          - name: enable_traps
            value: 'true'
          redeploy_template: ON_CHANGE
        - name: EDGE_AAA_template
          variables:
          - name: tacacs_group_name
            value: TACACS_GROUP
          - name: tacacs_servers
            value: |
              tacacs-svr-01|192.0.2.11|need_input,tacacs-svr-02|192.0.2.12|need_input
          redeploy_template: ON_CHANGE
        - name: EDGE_ACCESS_PORT_template
          variables:
          - name: access_interfaces
            value: |
              GigabitEthernet1/0/1|ACCESS-DATA|10||false|2|restrict|true|true|true|true|2.00 1.00|2.00 1.00,
              GigabitEthernet1/0/2|ACCESS-VOICE|10|20|false|2|restrict|true|true|true|true|2.00 1.00|2.00 1.00
          redeploy_template: ON_CHANGE
