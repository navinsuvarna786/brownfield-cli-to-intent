catalyst_center:
  inventory:
    devices:
    - name: EDGE-SW-REMOTE-05
      fqdn_name: EDGE-SW-REMOTE-05.campus.example.edu
      device_ip: need_input
      pid: C9300-24P
      serial_number: TBD-MIGRATION
      state: PNP
      device_role: ACCESS
      site: need_input
      onboarding_template:
        name: EDGE_PNP_template
        variables:
        - name: device_host_name
          value: EDGE-SW-REMOTE-05
        - name: domain_name
          value: campus.example.edu
        - name: pnp_vlan_id
          value: '1'
        - name: pnp_vlan_name
          value: MGMT
        - name: pnp_vlan_network_add
          value: need_input
        - name: pnp_vlan_network_mask
          value: 255.255.255.0
        - name: pnp_vlan_default_gateway
          value: need_input
        - name: pnp_interface
          value: GigabitEthernet1/0/1
        - name: snmp_community_ro
          value: xxxxxxxx
        - name: log_server
          value: 192.0.2.21
        - name: is_stack
          value: 'false'
        - name: stack_members
          value: '1'
      dayn_templates:
        regular:
        - name: EDGE_SYSTEM_template
          variables:
          - name: enable_secret
            value: need_input
          - name: hostname
            value: EDGE-SW-REMOTE-05
          - name: domain_name
            value: campus.example.edu
          - name: timezone
            value: need_input
          - name: timezone_offset
            value: need_input
          - name: daylight_savings_name
            value: need_input
          - name: dns_servers
            value: |
              192.0.2.50,192.0.2.60,192.0.2.50,192.0.2.60
          - name: ntp_servers
            value: |
              192.0.2.11|prefer,192.0.2.12
          - name: license_level
            value: network-advantage
          - name: stp_mode
            value: rapid-pvst
          - name: ntp_authenticate
            value: 'false'
          - name: ntp_master
            value: 'false'
          - name: logging_servers
            value: |
              192.0.2.21,192.0.2.22,192.0.2.23
          - name: log_severity_level
            value: informational
          - name: local_users
            value: |
              xxxxxxxx:need_input
          redeploy_template: ON_CHANGE
        - name: EDGE_VLAN_template
          variables:
          - name: vlans
            value: 18|DATA,903|MGMT
          - name: vtp_domain
            value: CWAN
          - name: vtp_mode
            value: transparent
          redeploy_template: ON_CHANGE
        - name: EDGE_MGMT_template
          variables:
          - name: enable_management
            value: 'false'
          - name: http_server
            value: 'true'
          - name: https_server
            value: 'true'
          - name: mgmt_vrf_config
            value: |
              Mgmt-vrf|||
          - name: mgmt_interface_type
            value: vlan
          - name: mgmt_vlan_id
            value: '1'
          - name: mgmt_ip_address
            value: need_input
          - name: mgmt_subnet_mask
            value: 255.255.255.0
          - name: mgmt_default_gateway
            value: need_input
          - name: mgmt_vlan_name
            value: MGMT
          redeploy_template: ON_CHANGE
        - name: EDGE_ACL_template
          variables:
          - name: standard_acls
            value: |
              13|10|permit|192.0.2.0|0.0.0.255|false,
              13|20|deny|any||true
          - name: extended_acls
            value: ''
          redeploy_template: ON_CHANGE
        - name: EDGE_UPLINK_template
          variables:
          - name: uplinks
            value: |
              trunk|TenGigabitEthernet1/1/1|DISCOVERED-UPLINK-1||18,903|903|true||,
              trunk|TenGigabitEthernet1/1/2|DISCOVERED-UPLINK-2||18,903|903|true||
          redeploy_template: ON_CHANGE
        - name: EDGE_SNMP_template
          variables:
          - name: snmp_community_ro
            value: xxxxxxxx
          - name: snmp_community_rw
            value: xxxxxxxx
          - name: snmp_location
            value: Remote Edge Site-5
          - name: snmp_contact
            value: NOC-555-0100
          - name: snmp_acl_ro
            value: '13'
          - name: snmp_acl_rw
            value: '13'
          - name: enable_traps
            value: 'false'
          redeploy_template: ON_CHANGE
        - name: EDGE_ACCESS_PORT_template
          variables:
          - name: access_interfaces
            value: |
              GigabitEthernet1/0/1|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/2|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/3|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/4|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/5|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/6|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/7|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/8|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/9|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/10|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/11|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/12|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/13|Access Port|18||false|2|restrict|true|true|true|false||,
