              GigabitEthernet1/0/18|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/19|Access Port|18||false|2|restrict|true|true|true|false||,
              GigabitEthernet1/0/20|Access Port|18||false|2|restrict|true|true|true|false||,
